components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    ModelCatalogPayload:
      type: object
      required:
      - alias
      - provider
      - provider_model
      properties:
        alias:
          type: string
          description: Unique alias exposed to clients.
        provider:
          type: string
          description: Provider slug (openai, azure, bedrock, anthropic, etc.).
        provider_model:
          type: string
          description: Upstream model identifier.
        model_type:
          type: string
          description: Model category (llm, embedding, image, moderation, audio_speech,
            audio_transcription).
        context_window:
          type: integer
          format: int32
        max_output_tokens:
          type: integer
          format: int32
        modalities:
          type: array
          items:
            type: string
        supports_tools:
          type: boolean
        price_input:
          type: number
          format: float
        price_output:
          type: number
          format: float
        currency:
          type: string
        deployment:
          type: string
        endpoint:
          type: string
        api_key:
          type: string
        api_version:
          type: string
        region:
          type: string
        weight:
          type: integer
          format: int32
        enabled:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string
        pricing_tiers:
          type: object
          additionalProperties: true
        provider_overrides:
          type: object
          additionalProperties: true
          description: Provider-specific overrides.
      example: *id001
    ModelCatalogEntry:
      type: object
      properties:
        alias:
          type: string
        provider:
          type: string
        provider_model:
          type: string
        model_type:
          type: string
        context_window:
          type: integer
          format: int32
        max_output_tokens:
          type: integer
          format: int32
        modalities_json:
          type: string
        supports_tools:
          type: boolean
        pricing_tiers_json:
          type: string
        price_input:
          type: string
        price_output:
          type: string
        currency:
          type: string
        enabled:
          type: boolean
        provider_config_json:
          type: string
        updated_at:
          type: string
          format: date-time
        deployment:
          type: string
        endpoint:
          type: string
        api_key:
          type: string
        api_version:
          type: string
        region:
          type: string
        metadata_json:
          type: string
        weight:
          type: integer
          format: int32
      example: *id002
    ModelCatalogStatusItem:
      type: object
      properties:
        alias:
          type: string
        status:
          type: string
          enum:
          - online
          - degraded
          - offline
          - unknown
          - disabled
    ModelCatalogStatusResponse:
      type: object
      properties:
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/ModelCatalogStatusItem'
    GenericRequest:
      type: object
      additionalProperties: true
      example:
        note: See endpoint description or docs for required fields.
    GenericResponse:
      type: object
      additionalProperties: true
      example:
        status: ok
    AdminLoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      example:
        email: admin@example.com
        password: changeme
    AdminRefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      example:
        refresh_token: refresh_token_value
    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
    AdminTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
        method:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/AdminUser'
    CreateTenantRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
      example:
        name: Acme
        status: active
    UpdateTenantRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
      example:
        name: Acme Inc
    UpdateTenantStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - active
          - suspended
      example:
        status: suspended
    TenantRateLimitRequest:
      type: object
      properties:
        requests_per_minute:
          type: integer
        tokens_per_minute:
          type: integer
        parallel_requests:
          type: integer
      example:
        requests_per_minute: 60
        tokens_per_minute: 60000
        parallel_requests: 8
    TenantModelsRequest:
      type: object
      properties:
        models:
          type: array
          items:
            type: string
      example:
        models:
        - gpt-4o-mini
        - text-embedding-3-small
    TenantMembershipRequest:
      type: object
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
        password:
          type: string
      example:
        email: member@example.com
        role: viewer
    AdminAPIKeyRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        quota:
          type: object
          additionalProperties: true
        rate_limits:
          $ref: '#/components/schemas/TenantRateLimitRequest'
      example:
        name: prod key
        scopes:
        - chat:write
        quota:
          budget_usd: 100
    AdminCreateUserRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
        send_invite:
          type: boolean
      example:
        email: user@example.com
        name: User
        send_invite: true
    AdminBudgetDefaultsRequest:
      type: object
      properties:
        default_usd:
          type: number
        warning_threshold:
          type: number
        refresh_schedule:
          type: string
        alert_emails:
          type: array
          items:
            type: string
        alert_webhooks:
          type: array
          items:
            type: string
        alert_cooldown_seconds:
          type: integer
      example:
        default_usd: 100
        warning_threshold: 0.8
        refresh_schedule: monthly
    AdminBudgetOverrideRequest:
      type: object
      properties:
        budget_usd:
          type: number
        warning_threshold:
          type: number
        refresh_schedule:
          type: string
        alert_emails:
          type: array
          items:
            type: string
        alert_webhooks:
          type: array
          items:
            type: string
        alert_cooldown_seconds:
          type: integer
          nullable: true
      example:
        budget_usd: 500
        warning_threshold: 0.9
        refresh_schedule: monthly
    BillingWebhookRequest:
      type: object
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
      example:
        url: https://hooks.example.com/billing
        events:
        - invoice.created
        enabled: true
    UserProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
        theme_preference:
          type: string
      example:
        name: Jane Doe
        theme_preference: dark
    UserPasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
      example:
        current_password: oldpass
        new_password: newpass
    ChatCompletionRequest:
      type: object
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            type: object
        stream:
          type: boolean
      example:
        model: gpt-4o-mini
        messages:
        - role: user
          content: Hello
        stream: false
    ChatCompletionResponse:
      type: object
      example:
        id: chatcmpl_123
        object: chat.completion
        choices:
        - index: 0
          message:
            role: assistant
            content: Hi!
          finish_reason: stop
        usage:
          prompt_tokens: 10
          completion_tokens: 5
          total_tokens: 15
    EmbeddingRequest:
      type: object
      properties:
        model:
          type: string
        input:
          type: string
      example:
        model: text-embedding-3-small
        input: Hello
    EmbeddingResponse:
      type: object
      example:
        object: list
        data:
        - index: 0
          embedding:
          - 0.1
          - 0.2
          - 0.3
        model: text-embedding-3-small
    ImageGenerationRequest:
      type: object
      properties:
        model:
          type: string
        prompt:
          type: string
        size:
          type: string
      example:
        model: gpt-image-1
        prompt: A logo
        size: 1024x1024
    ImageGenerationResponse:
      type: object
      example:
        created: 1710000000
        data:
        - url: https://example.com/image.png
    AudioSpeechRequest:
      type: object
      properties:
        model:
          type: string
        input:
          type: string
        voice:
          type: string
        format:
          type: string
      example:
        model: gpt-4o-mini-tts
        input: Hello
        voice: alloy
        format: mp3
    FileUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        purpose:
          type: string
    BatchCreateRequest:
      type: object
      properties:
        input_file_id:
          type: string
        endpoint:
          type: string
        completion_window:
          type: string
        metadata:
          type: object
      example:
        input_file_id: file_123
        endpoint: /v1/chat/completions
        completion_window: 24h
