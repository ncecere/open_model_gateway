# Open Model Gateway sample configuration
#
# Copy this file to deploy/router.local.yaml (or another config path) and adjust secrets for your environment.

server:
  listen_addr: ":8080"
  body_limit_mb: 20
  sync_timeout: 300s
  stream_idle_timeout: 30s
  stream_max_duration: 300s
  provider_timeout: 280s
  read_header_timeout: 5s
  graceful_shutdown_delay: 5s

database:
  url: "postgres://open_gateway:open_gateway@localhost:5432/open_gateway?sslmode=disable"
  run_migrations: true
  migrations_dir: "./migrations"
  max_conns: 20
  min_conns: 2
  max_conn_idle_time: 10m
  max_conn_lifetime: 1h

redis:
  url: "redis://localhost:6379/0"
  db: 0
  pool_size: 20

logging:
  level: "info"                # debug, info, warn, error
  format: "json"               # text or json
  wide_event:
    enabled: true              # emit a single comprehensive log line per request
    include_user_agent: true   # include User-Agent in the wide event
    include_headers: false     # include additional headers (if applicable)

observability:
  enable_metrics: true
  enable_otlp: true
  otlp_endpoint: "http://localhost:4317"

rate_limits:
  default_tokens_per_minute: 1000000
  default_requests_per_minute: 1000
  default_parallel_requests_key: 10
  default_parallel_requests_tenant: 100

budgets:
  default_usd: 100.0
  warning_threshold_perc: 0.8
  refresh_schedule: "calendar_month"
  alert:
    enabled: true
    emails:
      - "ops@example.com"
    webhooks: []
    cooldown: "1h"
    smtp:
      host: ""
      port: 587
      username: ""
      password: ""
      from: ""
      use_tls: true
      skip_tls_verify: false
      connect_timeout: 5s
    webhook:
      timeout: 5s
      max_retries: 3

reporting:
  timezone: "UTC"

providers:
  openai:
    api_key: ""
    openai_organization: ""
    base_url: ""
  anthropic:
    api_key: ""
    base_url: ""
    version: ""
  azure:
    endpoint: "https://your-resource.openai.azure.com"
    api_key: ""
    api_version: "2024-07-01-preview"
    region: ""
  bedrock:
    region: ""
    aws_access_key_id: ""
    aws_secret_access_key: ""
    aws_session_token: ""
    aws_profile: ""
  vertex:
    gcp_project_id: ""
    gcp_credentials_json: ""
    gcp_credentials_format: ""
    vertex_location: ""
    vertex_publisher: ""
  hugging_face_token: ""
  openai_compatible:
    base_url: ""
    api_key: ""
    openai_organization: ""
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key: ""
    referer: "https://your-app.example.com"
    app_name: "Open Model Gateway"
  groq:
    base_url: "https://api.groq.com/openai/v1"
    api_key: ""
    region: ""
  vllm:
    base_url: "http://localhost:8000/v1"
    mode: "openai"              # openai or tgi
    api_key: ""
    auth_header: "Authorization"

files:
  storage: "local"           # local or s3
  max_size_mb: 200
  default_ttl: 168h          # 7d
  max_ttl: 720h              # 30d
  sweep_interval: 15m
  sweep_batch_size: 200
  encryption_key: ""         # optional base64 AES key
  local:
    directory: "./data/files"
  s3:
    bucket: ""
    prefix: ""
    region: ""
    endpoint: ""
    use_path_style: false

audio:
  max_upload_mb: 50

batches:
  max_requests: 5000
  max_concurrency: 50
  default_ttl: 168h
  max_ttl: 720h

retention:
  metadata_days: 30
  zero_retention: false

health:
  check_interval: 60s
  rolling_window: 5
  cooldown: 5m

admin:
  session:
    jwt_secret: "change-me"
    access_token_ttl: 15m
    refresh_token_ttl: 24h
    cookie_name: "og_admin_session"
  local:
    enabled: true
  oidc:
    enabled: false
    issuer: ""
    client_id: ""
    client_secret: ""
    redirect_url: "https://admin.localhost/auth/oidc/callback"
    scopes: ["openid", "email", "profile"]
    allowed_domains: []
    http_timeout: 5s
    roles_claim: "roles"        # claim containing roles/groups (optional)
    allowed_roles: []           # restrict sign-in to these roles (optional)
    admin_roles: []             # roles that should map to super-admin access

# Example catalog entries (trim to the providers you need)
model_catalog:
  - alias: "gpt-4o-azure"
    provider: "azure"
    provider_model: "gpt-4o"
    model_type: "llm"
    context_window: 128000
    max_output_tokens: 4096
    modalities: ["text"]
    supports_tools: true
    price_input: 0.005
    price_output: 0.015
    currency: "USD"
    pricing_tiers:
      input:
        - unit: tokens_per_million
          max_units: 200000
          price_per_unit: 1.25
          metadata:
            context_scope: "<=200k"
        - unit: tokens_per_million
          price_per_unit: 2.50
          metadata:
            context_scope: ">200k"
      output:
        - unit: tokens_per_million
          price_per_unit: 10.0
    azure:
      deployment: "gpt-4o-deployment-eastus"
      endpoint: "https://sub1-eastus.openai.azure.com"
      api_key: "AZURE_SUB1_KEY"
      api_version: "2024-07-01-preview"
      region: "eastus"
  - alias: "gpt-image-1"
    provider: "openai"
    provider_model: "gpt-image-1"
    model_type: "image"
    context_window: 0
    max_output_tokens: 0
    modalities: ["image"]
    supports_tools: false
    price_input: 0.04
    price_output: 0.08
    currency: "USD"
    pricing_tiers:
      image:
        - unit: per_image
          price_per_unit: 0.01
          metadata:
            quality: "low"
            resolution: "512x512"
        - unit: per_image
          price_per_unit: 0.04
          metadata:
            quality: "standard"
            resolution: "1024x1024"
        - unit: per_image
          price_per_unit: 0.17
          metadata:
            quality: "hd"
            resolution: "2048x2048"
      image_edit:
        - unit: per_image
          price_per_unit: 0.08
          metadata:
            quality: "standard"
      image_variation:
        - unit: per_image
          price_per_unit: 0.12
          metadata:
            quality: "standard"
    deployment: "gpt-image-1"
    openai:
      openai_organization: ""
    metadata:
      description: "Full images API (generate/edit/variation)"

  - alias: "gpt-4o-mini-tts"
    provider: "openai"
    provider_model: "gpt-4o-mini-tts"
    model_type: "audio_speech"
    context_window: 0
    max_output_tokens: 0
    modalities: ["audio"]
    supports_tools: false
    price_input: 0
    price_output: 0
    currency: "USD"
    pricing_tiers:
      tts:
        - unit: per_million_characters
          price_per_unit: 12.0
          metadata:
            voice: "alloy"
        - unit: per_million_characters
          price_per_unit: 18.0
          metadata:
            voice: "alloy"
            quality: "hd"
    deployment: "gpt-4o-mini-tts"
    metadata:
      audio_voice: "alloy"
      audio_format: "mp3"
      price_tts_million_chars_cents: "1500" # $15.00 per 1M characters

  - alias: "gpt-4o-mini-transcribe"
    provider: "openai"
    provider_model: "gpt-4o-mini-transcribe"
    model_type: "audio_transcription"
    context_window: 0
    max_output_tokens: 0
    modalities: ["audio"]
    supports_tools: false
    price_input: 0
    price_output: 0
    currency: "USD"
    pricing_tiers:
      audio:
        - unit: per_minute
          price_per_unit: 0.003
          metadata:
            operation: "stt"
      video:
        - unit: per_second
          price_per_unit: 0.0003
          metadata:
            operation: "stt"
            channel: "audio+video"
    deployment: "gpt-4o-mini-transcribe"
    metadata:
      audio_formats: "json,verbose_json,diarized_json,text,srt,vtt"
      audio_timestamp_granularities: "word,segment"
      audio_streaming: "true"
      price_audio_minute_cents: "60" # $0.60 per minute of input audio

  - alias: "llama-3-vllm"
    provider: "vllm"
    provider_model: "meta-llama/Meta-Llama-3-8B-Instruct"
    model_type: "llm"
    context_window: 8192
    max_output_tokens: 2048
    modalities: ["text"]
    supports_tools: true
    price_input: 0.15
    price_output: 0.45
    currency: "USD"
    deployment: "llama-3-vllm"
    endpoint: "http://localhost:8000/v1"
    metadata:
      vllm_mode: "openai"

  - alias: "llama-3-tgi"
    provider: "vllm"
    provider_model: "meta-llama/Meta-Llama-3-8B-Instruct"
    model_type: "llm"
    context_window: 8192
    max_output_tokens: 2048
    modalities: ["text"]
    supports_tools: false
    price_input: 0.15
    price_output: 0.45
    currency: "USD"
    deployment: "llama-3-tgi"
    endpoint: "http://localhost:8080"
    metadata:
      vllm_mode: "tgi"
      auth_header: "Authorization"

  - alias: "partner-gpt-image"
    provider: "openai-compatible"
    provider_model: "gpt-image-1"
    model_type: "image"
    context_window: 0
    max_output_tokens: 0
    modalities: ["image"]
    supports_tools: false
    price_input: 0
    price_output: 0
    currency: "USD"
    pricing_tiers:
      image:
        - unit: per_megapixel
          price_per_unit: 0.012
          metadata:
            quality: "standard"
    deployment: "gpt-image-1"
    openai_compatible:
      base_url: "https://partners.example.com/v1"
      api_key: "PARTNER_IMAGE_KEY"
      openai_organization: ""

  - alias: "openrouter-qwen72b"
    provider: "openrouter"
    provider_model: "qwen/qwen2.5-72b-instruct"
    model_type: "llm"
    context_window: 32768
    max_output_tokens: 4096
    modalities: ["text"]
    supports_tools: true
    price_input: 0.0004
    price_output: 0.0008
    currency: "USD"
    pricing_tiers:
      input:
        - unit: tokens_per_million
          price_per_unit: 0.4
      output:
        - unit: tokens_per_million
          price_per_unit: 0.8
    deployment: "qwen2.5-72b-instruct"
    openrouter:
      api_key: "OPENROUTER_API_KEY"
      referer: "https://your-app.example.com"
      app_name: "Open Model Gateway"
    metadata:
      description: "Example OpenRouter alias using providers.openrouter defaults."

  - alias: "groq-llama3-70b"
    provider: "groq"
    provider_model: "llama-3.3-70b-versatile"
    model_type: "llm"
    context_window: 131072
    max_output_tokens: 32768
    modalities: ["text"]
    supports_tools: true
    price_input: 0.59
    price_output: 0.79
    currency: "USD"
    pricing_tiers:
      input:
        - unit: tokens_per_million
          price_per_unit: 0.59
      output:
        - unit: tokens_per_million
          price_per_unit: 0.79
    deployment: "llama-3.3-70b-versatile"
    groq:
      api_key: "GROQ_API_KEY"
      region: "us-east-1"

  - alias: "groq-mixtral-8x7b"
    provider: "groq"
    provider_model: "mixtral-8x7b"
    model_type: "llm"
    context_window: 32768
    max_output_tokens: 8192
    modalities: ["text"]
    supports_tools: false
    price_input: 0.27
    price_output: 0.27
    currency: "USD"
    pricing_tiers:
      input:
        - unit: tokens_per_million
          price_per_unit: 0.27
      output:
        - unit: tokens_per_million
          price_per_unit: 0.27
    deployment: "mixtral-8x7b"
    groq:
      api_key: "GROQ_API_KEY"
      region: "us-east-1"

  - alias: "claude-3-sonnet"
    provider: "bedrock"
    provider_model: "anthropic.claude-3-sonnet-20240229-v1:0"
    model_type: "llm"
    context_window: 200000
    max_output_tokens: 4096
    modalities: ["text"]
    supports_tools: false
    price_input: 0.006
    price_output: 0.015
    currency: "USD"
    pricing_tiers:
      input:
        - unit: tokens_per_million
          price_per_unit: 6.0
      output:
        - unit: tokens_per_million
          price_per_unit: 15.0
    deployment: "anthropic.claude-3-sonnet-20240229-v1:0"
    bedrock:
      region: "us-west-2"
      aws_profile: ""
      aws_session_token: ""
  
  - alias: "titan-image"
    provider: "bedrock"
    provider_model: "amazon.titan-image-generator-v1"
    model_type: "image"
    modalities: ["image"]
    supports_tools: false
    price_input: 0
    price_output: 0
    currency: "USD"
    pricing_tiers:
      image:
        - unit: per_image
          price_per_unit: 0.018
          metadata:
            quality: "standard"
        - unit: per_image
          price_per_unit: 0.036
          metadata:
            quality: "premium"
    deployment: "amazon.titan-image-generator-v1"
    weight: 100
    bedrock:
      region: "us-west-2"
      bedrock_image_task_type: "TEXT_IMAGE"
    metadata:
      bedrock_image_quality: "standard"
      bedrock_image_cfg_scale: "8"
      bedrock_image_strength: "0.35"
      bedrock_image_mask_source: "MASK_IMAGE_WHITE"
      bedrock_image_variation_prompt: "variation of the provided reference image"
      bedrock_image_init_mode: "IMAGE_STRENGTH"

  - alias: "stable-diffusion-xl"
    provider: "bedrock"
    provider_model: "stability.stable-diffusion-xl-v1"
    model_type: "image"
    modalities: ["image"]
    supports_tools: false
    price_input: 0
    price_output: 0
    currency: "USD"
    pricing_tiers:
      image:
        - unit: per_image
          price_per_unit: 0.02
          metadata:
            quality: "standard"
        - unit: per_image
          price_per_unit: 0.05
          metadata:
            quality: "premium"
    deployment: "stability.stable-diffusion-xl-v1"
    weight: 100
    bedrock:
      region: "us-west-2"
      bedrock_image_task_type: "TEXT_IMAGE"
    metadata:
      bedrock_image_quality: "premium"
      bedrock_image_cfg_scale: "10"
      aws_session_token: ""
      aws_profile: ""

  - alias: "vertex-imagen-3"
    provider: "vertex"
    provider_model: "imagen-3.0-generate-001"
    context_window: 0
    max_output_tokens: 0
    modalities: ["image"]
    supports_tools: false
    price_input: 0
    price_output: 0
    currency: "USD"
    pricing_tiers:
      image:
        - unit: per_image
          price_per_unit: 0.025
          metadata:
            quality: "standard"
        - unit: per_image
          price_per_unit: 0.05
          metadata:
            quality: "hd"
    deployment: "imagen-3.0-generate-001"
    vertex:
      gcp_project_id: "vertex-project"
      vertex_location: "us-central1"
      vertex_publisher: "google"
      gcp_credentials_json: "${VERTEX_CREDS_BASE64}"
      gcp_credentials_format: "base64"
    metadata:
      vertex_edit_mode: "EDIT_MODE_INPAINT_INSERTION"
      vertex_mask_mode: "MASK_MODE_USER_PROVIDED"
      vertex_mask_dilation: "0.01"
      vertex_guidance_scale: "60"
      vertex_base_steps: "35"
      vertex_variation_prompt: ""
      vertex_person_generation: "allow_adult"

  - alias: "vertex-nano-banana"
    provider: "vertex"
    provider_model: "imagen-3.0-fast-generate-001"
    context_window: 0
    max_output_tokens: 0
    modalities: ["image"]
    supports_tools: false
    price_input: 0
    price_output: 0
    currency: "USD"
    pricing_tiers:
      image:
        - unit: per_image
          price_per_unit: 0.015
          metadata:
            quality: "standard"
    deployment: "imagen-3.0-fast-generate-001"
    vertex:
      gcp_project_id: "vertex-project"
      vertex_location: "us-central1"
      vertex_publisher: "google"
      gcp_credentials_json: "${VERTEX_CREDS_BASE64}"
      gcp_credentials_format: "base64"
    metadata:
      description: "Imagen Nano Banana reference"
      vertex_mask_mode: "MASK_MODE_USER_PROVIDED"
      vertex_mask_dilation: "0.01"
      vertex_guidance_scale: "40"
      vertex_base_steps: "25"
      vertex_person_generation: "allow_adult"

bootstrap:
  tenants:
    - name: "demo"
      status: "active"
  admin_users:
    - email: "admin@example.com"
      name: "Demo Admin"
      password: "change-me"
  api_keys:
    - tenant: "demo"
      name: "demo-shared"
      prefix: "demo"
      secret: "demo-secret"
      scopes: ["chat", "embeddings", "images", "files", "batches"]
  memberships:
    - tenant: "demo"
      email: "admin@example.com"
      role: "owner"
  tenant_limits:
    - tenant: "demo"
      tokens_per_minute: 2000000
      requests_per_minute: 2000
  tenant_budgets:
    - tenant: "demo"
      budget_usd: 250.0
      warning_threshold: 0.85
      refresh_schedule: "weekly"
      alert_emails:
        - "billing@example.com"
      alert_cooldown: "2h"
